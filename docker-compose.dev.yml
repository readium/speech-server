# Dev override: mount source for hot-reload and live test edits.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  app:
    restart: "no"
    stop_grace_period: 5s
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      # `uv sync --frozen --dev` (make *-docker targets) reads these; the image only has pyproject.
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    environment:
      - RELOAD=true
